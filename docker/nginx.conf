# Nginx del contenedor · sirve la PWA estática de Emma & Papá.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión de texto/estáticos.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # PWA: el HTML y el service worker NO se cachean (para que las actualizaciones lleguen);
    # el propio service worker gestiona el caché offline de la app.
    location = /index.html      { add_header Cache-Control "no-cache"; }
    location = /service-worker.js { add_header Cache-Control "no-cache"; }
    location = /manifest.json   { add_header Cache-Control "no-cache"; }

    # Higiene: no exponer el repositorio git ni los archivos de despliegue.
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(ya?ml|sql|md|dockerignore|log)$ { deny all; }
    location ^~ /docker/   { deny all; }
    location ^~ /scripts/  { deny all; }
    location ^~ /supabase/ { deny all; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
